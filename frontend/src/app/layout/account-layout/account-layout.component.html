<div class="account-layout">
  <!-- Sidebar -->
  <aside class="account-layout__sidebar" aria-label="Account navigation" appRevealOnScroll variant="fade">
    <!-- User card -->
    <div class="account-layout__user">
      <span class="account-layout__avatar" aria-hidden="true">{{ userInitial() }}</span>
      <div class="account-layout__user-info">
        <p class="account-layout__user-name">{{ user()?.name || 'Account' }}</p>
        <p class="account-layout__user-email">{{ user()?.email }}</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="account-layout__nav">
      <ul class="account-layout__nav-list">
        @for (item of navItems; track item.path) {
          <li>
            @if (item.disabled) {
              <span class="account-layout__nav-link is-disabled" aria-disabled="true">
                <span class="account-layout__nav-icon" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="item.icon" /></svg>
                </span>
                <span class="account-layout__nav-label">{{ item.labelKey | translate }}</span>
                <span class="account-layout__nav-badge">Soon</span>
              </span>
            } @else {
              <a
                [routerLink]="item.path"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: item.path === '/account' }"
                class="account-layout__nav-link"
              >
                <span class="account-layout__nav-icon" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="item.icon" /></svg>
                </span>
                <span class="account-layout__nav-label">{{ item.labelKey | translate }}</span>
              </a>
            }
          </li>
        }
      </ul>
    </nav>

    <!-- Sign out -->
    <button type="button" class="account-layout__signout" (click)="onSignOut()">
      <span class="account-layout__nav-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </span>
      <span class="account-layout__nav-label">{{ 'nav.signOut' | translate }}</span>
    </button>
  </aside>

  <!-- Content -->
  <section class="account-layout__content">
    <router-outlet />
  </section>
</div>

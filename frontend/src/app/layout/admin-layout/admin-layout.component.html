<div class="admin-layout">
  <!-- Backdrop -->
  <div
    class="admin-layout__backdrop"
    [class.is-open]="sidebarOpen()"
    (click)="closeSidebar()"
    role="presentation"
  ></div>

  <!-- Sidebar -->
  <aside
    class="admin-layout__sidebar"
    [class.is-open]="sidebarOpen()"
    aria-label="Admin navigation"
  >
    <!-- Brand -->
    <a routerLink="/admin" class="admin-layout__brand" (click)="closeSidebar()">
      <img
        src="assets/logo/bosi-logo.png"
        alt=""
        class="admin-layout__brand-icon"
        width="52"
        height="52"
        aria-hidden="true"
      />
      <div class="admin-layout__brand-text">
        <p class="admin-layout__brand-name">Bosi <span>Gift</span></p>
        <p class="admin-layout__brand-role">Admin Panel</p>
      </div>
    </a>

    <!-- Navigation -->
    <nav class="admin-layout__nav">
      <ul class="admin-layout__nav-list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: !!item.exact }"
              class="admin-layout__nav-link"
              (click)="closeSidebar()"
            >
              <span class="admin-layout__nav-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="item.icon" /></svg>
              </span>
              <span class="admin-layout__nav-label">{{ item.labelKey | translate }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Sign out -->
    <button type="button" class="admin-layout__signout" (click)="signOut()">
      <span class="admin-layout__nav-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </span>
      <span class="admin-layout__nav-label">{{ 'nav.signOut' | translate }}</span>
    </button>
  </aside>

  <!-- Main -->
  <div class="admin-layout__main">
    <!-- Topbar -->
    <header class="admin-layout__topbar">
      <button
        type="button"
        class="admin-layout__burger"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="admin-layout__topbar-title">
        <ng-content select="[topbar-title]" />
      </div>

      <div class="admin-layout__topbar-actions">
        <app-language-switcher variant="compact" />
        <app-theme-toggle />

        <!-- User dropdown -->
        <div class="admin-layout__user-wrap">
          <button
            type="button"
            class="admin-layout__user"
            (click)="toggleUserMenu()"
            [attr.aria-expanded]="userMenuOpen()"
            aria-haspopup="menu"
          >
            <span class="admin-layout__user-avatar" aria-hidden="true">{{ userInitial() }}</span>
            <div class="admin-layout__user-info">
              <p class="admin-layout__user-name">{{ user()?.name || 'Admin' }}</p>
              <p class="admin-layout__user-email">{{ user()?.email || '' }}</p>
            </div>
            <svg class="admin-layout__user-chevron" [class.is-open]="userMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          @if (userMenuOpen()) {
            <div class="admin-layout__user-menu" role="menu">
              <button type="button" class="admin-layout__user-menu-item" (click)="goToStore()" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                {{ 'admin.viewStore' | translate }}
              </button>
              <button type="button" class="admin-layout__user-menu-item" (click)="goToAccount()" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                {{ 'admin.myAccount' | translate }}
              </button>
              <div class="admin-layout__user-menu-divider"></div>
              <button type="button" class="admin-layout__user-menu-item admin-layout__user-menu-item--danger" (click)="signOut()" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                {{ 'nav.signOut' | translate }}
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="admin-layout__content">
      <router-outlet />
    </main>
  </div>
</div>

@if (totalPages() > 1) {
  <nav class="app-pagination" aria-label="Pagination">
    @if (showPrevNext()) {
      <button
        type="button"
        class="app-pagination__btn app-pagination__nav"
        [disabled]="!canGoPrev()"
        (click)="prev()"
        aria-label="Previous page"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    }

    @for (p of visiblePages(); track $index) {
      @if (p === '...') {
        <span class="app-pagination__ellipsis" aria-hidden="true">…</span>
      } @else {
        <button
          type="button"
          class="app-pagination__btn"
          [class.is-active]="p === page()"
          [attr.aria-current]="p === page() ? 'page' : null"
          (click)="goTo(p)"
        >
          {{ p }}
        </button>
      }
    }

    @if (showPrevNext()) {
      <button
        type="button"
        class="app-pagination__btn app-pagination__nav"
        [disabled]="!canGoNext()"
        (click)="next()"
        aria-label="Next page"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    }
  </nav>
}

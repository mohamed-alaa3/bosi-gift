<!-- Inline variant (default) -->
@if (!expanded()) {
  <div class="app-search" [class.is-focused]="isFocused()">
    <span class="app-search__icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </span>

    <input
      #inputEl
      type="search"
      class="app-search__input"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      aria-label="Search"
    />

    @if (value()) {
      <button
        type="button"
        class="app-search__clear"
        (click)="clear()"
        aria-label="Clear search"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    }

    @if (showShortcut() && !isFocused() && !value()) {
      <span class="app-search__shortcut" aria-hidden="true">⌘K</span>
    }
  </div>
}

<!-- Expanded (modal-like) variant -->
@if (expanded() && isExpanded()) {
  <div class="app-search-overlay" (click)="closeExpanded()" role="presentation">
    <div class="app-search-overlay__inner" (click)="$event.stopPropagation()">
      <div class="app-search">
        <span class="app-search__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>

        <input
          #inputEl
          type="search"
          class="app-search__input"
          [placeholder]="placeholder()"
          [value]="value()"
          (input)="onInput($event)"
          (keydown)="onKeydown($event)"
          autofocus
          aria-label="Search"
        />

        <button
          type="button"
          class="app-search__close"
          (click)="closeExpanded()"
          aria-label="Close search"
        >
          Esc
        </button>
      </div>
    </div>
  </div>
}

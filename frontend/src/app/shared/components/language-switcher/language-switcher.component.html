@if (variant() === 'compact') {
  <button
    type="button"
    class="app-lang app-lang--compact"
    (click)="toggle()"
    [attr.aria-label]="'Switch to ' + otherLabel()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
    <span class="app-lang__label">{{ otherLabel() }}</span>
  </button>
} @else {
  <div class="app-lang app-lang--full" role="group" aria-label="Language">
    <button
      type="button"
      class="app-lang__option"
      [class.is-active]="current() === 'en'"
      (click)="use('en')"
      [attr.aria-pressed]="current() === 'en'"
    >
      English
    </button>
    <button
      type="button"
      class="app-lang__option"
      [class.is-active]="current() === 'ar'"
      (click)="use('ar')"
      [attr.aria-pressed]="current() === 'ar'"
    >
      العربية
    </button>
  </div>
}

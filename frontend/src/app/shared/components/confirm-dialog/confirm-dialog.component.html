<app-modal
  [isOpen]="isOpen()"
  size="sm"
  [showCloseButton]="false"
  [ariaLabel]="title()"
  (closed)="onCancel()"
>
  <div class="app-confirm">
    <div class="app-confirm__icon" [class]="'app-confirm__icon--' + variant()">
      @if (variant() === 'danger') {
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      }
    </div>

    <h3 class="app-confirm__title">{{ title() }}</h3>
    @if (message()) {
      <p class="app-confirm__message">{{ message() }}</p>
    }
  </div>

  <div modal-footer class="app-confirm__actions">
    <button type="button" class="app-confirm__btn app-confirm__btn--cancel" (click)="onCancel()">
      {{ cancelText() }}
    </button>
    <button
      type="button"
      class="app-confirm__btn"
      [class.app-confirm__btn--danger]="variant() === 'danger'"
      [class.app-confirm__btn--primary]="variant() === 'primary'"
      (click)="onConfirm()"
    >
      {{ confirmText() }}
    </button>
  </div>
</app-modal>

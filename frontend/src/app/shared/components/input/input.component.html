<div class="app-input" [class.has-error]="showError()" [class.is-disabled]="isEffectivelyDisabled()">
  @if (label()) {
    <label [for]="inputId()" class="app-input__label">
      {{ label() }}
      @if (required()) {
        <span class="app-input__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="app-input__field">
    <span class="app-input__icon-start">
      <ng-content select="[icon-start]" />
    </span>

    <input
      [id]="inputId()"
      [type]="effectiveType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="isEffectivelyDisabled()"
      [required]="required()"
      [attr.autocomplete]="autocomplete() || null"
      [attr.aria-invalid]="showError()"
      [attr.aria-describedby]="hint() || error() ? describedById() : null"
      class="app-input__control"
      (input)="onInput($event)"
      (blur)="onBlur()"
      (focus)="onFocus()"
    />

    @if (type() === 'password' && showPasswordToggle()) {
      <button
        type="button"
        class="app-input__toggle"
        (click)="togglePassword()"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
      >
        @if (passwordVisible()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        }
      </button>
    }

    <span class="app-input__icon-end">
      <ng-content select="[icon-end]" />
    </span>
  </div>

  @if (showError()) {
    <p [id]="errorId()" class="app-input__error">{{ error() }}</p>
  } @else if (hint()) {
    <p [id]="describedById()" class="app-input__hint">{{ hint() }}</p>
  }
</div>

<nav class="app-breadcrumbs" [attr.aria-label]="ariaLabel()">
  <ol class="app-breadcrumbs__list">
    @for (item of items(); track $index; let isLast = $last) {
      <li class="app-breadcrumbs__item">
        @if (!isLast && item.url) {
          <a [routerLink]="item.url" class="app-breadcrumbs__link">
            {{ item.label }}
          </a>
        } @else {
          <span class="app-breadcrumbs__current" [attr.aria-current]="isLast ? 'page' : null">
            {{ item.label }}
          </span>
        }

        @if (!isLast) {
          <span class="app-breadcrumbs__sep" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        }
      </li>
    }
  </ol>
</nav>

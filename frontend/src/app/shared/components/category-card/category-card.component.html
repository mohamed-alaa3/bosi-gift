<a [routerLink]="link()" class="app-category-card">
  <div class="app-category-card__media">
    @if (image()) {
<img
  [src]="image() | safeImage"
  [alt]="category().name | localized"
  loading="lazy"
  decoding="async"
  class="app-category-card__image img-fallback"
/>
    } @else {
      <div class="app-category-card__placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
    }
  </div>

  <div class="app-category-card__body">
    <h3 class="app-category-card__title">{{ category().name | localized }}</h3>
    @if (category().description?.en || category().description?.ar) {
      <p class="app-category-card__desc">{{ category().description | localized }}</p>
    }
  </div>
</a>

<div class="sort">
  <button
    type="button"
    class="sort__trigger"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
    <span class="sort__label">{{ currentLabelKey() | translate }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="sort__chevron" [class.is-open]="open()" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  @if (open()) {
    <ul class="sort__menu" role="listbox">
      @for (choice of choices; track choice.value) {
        <li
          class="sort__option"
          role="option"
          [class.is-selected]="choice.value === value()"
          [attr.aria-selected]="choice.value === value()"
          (click)="choose(choice)"
        >
          {{ choice.labelKey | translate }}
          @if (choice.value === value()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          }
        </li>
      }
    </ul>
  }
</div>

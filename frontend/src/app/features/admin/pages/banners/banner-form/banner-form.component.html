<div class="banner-form">
  <header class="banner-form__header">
    <a routerLink="/admin/banners" class="banner-form__back">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      {{ 'admin.banners.backToList' | translate }}
    </a>
    <h1 class="banner-form__title">{{ getFormLabel() | translate }}</h1>
  </header>

  @if (loading()) {
    <div class="banner-form__loader">
      <app-loader size="lg" variant="spinner" />
    </div>
  }

  @if (!loading()) {
    <form [formGroup]="form" class="banner-form__panel" (ngSubmit)="submit()">
      <!-- Image -->
      <div class="banner-form__image-section">
        <div class="banner-form__preview">
          @if (previewUrl()) {
            <img [src]="previewUrl()" alt="" class="banner-form__preview-img" />
          } @else {
            <div class="banner-form__preview-placeholder" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </div>
          }
        </div>

        <label class="banner-form__upload">
          <input type="file" accept="image/jpeg,image/png,image/webp" hidden (change)="onImageSelected($event)" />
          {{ 'admin.banners.chooseImage' | translate }}
        </label>
      </div>

      <!-- Titles -->
      <div class="banner-form__grid">
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.titleEn' | translate }} *</label>
          <input type="text" class="banner-form__input" formControlName="titleEn" />
        </div>
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.titleAr' | translate }} *</label>
          <input type="text" dir="rtl" class="banner-form__input" formControlName="titleAr" />
        </div>
      </div>

      <!-- Subtitles -->
      <div class="banner-form__grid">
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.subtitleEn' | translate }}</label>
          <input type="text" class="banner-form__input" formControlName="subtitleEn" />
        </div>
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.subtitleAr' | translate }}</label>
          <input type="text" dir="rtl" class="banner-form__input" formControlName="subtitleAr" />
        </div>
      </div>

      <!-- Button text -->
      <div class="banner-form__grid">
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.buttonTextEn' | translate }}</label>
          <input type="text" class="banner-form__input" formControlName="buttonTextEn" />
        </div>
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.buttonTextAr' | translate }}</label>
          <input type="text" dir="rtl" class="banner-form__input" formControlName="buttonTextAr" />
        </div>
      </div>

      <!-- Link + Position -->
      <div class="banner-form__grid">
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.buttonLink' | translate }}</label>
          <input type="text" class="banner-form__input" formControlName="buttonLink" placeholder="/shop" />
        </div>
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.position' | translate }} *</label>
          <select class="banner-form__input" formControlName="position">
            @for (opt of positionOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.labelKey | translate }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Sort + Active -->
      <div class="banner-form__grid">
        <div class="banner-form__field">
          <label class="banner-form__label">{{ 'admin.banners.sortOrder' | translate }}</label>
          <input type="number" class="banner-form__input" formControlName="sortOrder" />
        </div>
        <label class="banner-form__check">
          <input type="checkbox" formControlName="isActive" />
          <span>{{ 'admin.banners.isActive' | translate }}</span>
        </label>
      </div>

      <div class="banner-form__actions">
        <a routerLink="/admin/banners" class="banner-form__btn banner-form__btn--ghost">
          {{ 'common.cancel' | translate }}
        </a>
        <button type="submit" class="banner-form__btn banner-form__btn--primary" [disabled]="submitting()">
          @if (submitting()) {
            <span class="banner-form__spinner" aria-hidden="true"></span>
          } @else {
            {{ 'common.save' | translate }}
          }
        </button>
      </div>
    </form>
  }
</div>

<div class="wrap-form">
  <header class="wrap-form__header">
    <a routerLink="/admin/wrap-styles" class="wrap-form__back">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      {{ 'admin.wrapStyles.backToList' | translate }}
    </a>
    <h1 class="wrap-form__title">{{ getFormLabel() | translate }}</h1>
  </header>

  @if (loading()) {
    <div class="wrap-form__loader">
      <app-loader size="lg" variant="spinner" />
    </div>
  }

  @if (!loading()) {
    <form [formGroup]="form" class="wrap-form__panel" (ngSubmit)="submit()">
      <div class="wrap-form__image-section">
        <div class="wrap-form__preview">
          @if (previewUrl()) {
            <img [src]="previewUrl()" alt="" class="wrap-form__preview-img" />
          } @else {
            <div class="wrap-form__preview-placeholder" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </div>
          }
        </div>

        <label class="wrap-form__upload">
          <input type="file" accept="image/jpeg,image/png,image/webp" hidden (change)="onImageSelected($event)" />
          {{ 'admin.wrapStyles.chooseImage' | translate }}
        </label>
      </div>

      <div class="wrap-form__grid">
        <div class="wrap-form__field">
          <label class="wrap-form__label">{{ 'admin.wrapStyles.nameEn' | translate }} *</label>
          <input type="text" class="wrap-form__input" formControlName="nameEn" />
        </div>
        <div class="wrap-form__field">
          <label class="wrap-form__label">{{ 'admin.wrapStyles.nameAr' | translate }} *</label>
          <input type="text" dir="rtl" class="wrap-form__input" formControlName="nameAr" />
        </div>
      </div>

      <div class="wrap-form__grid">
        <div class="wrap-form__field">
          <label class="wrap-form__label">{{ 'admin.wrapStyles.descEn' | translate }}</label>
          <textarea rows="3" class="wrap-form__input" formControlName="descriptionEn"></textarea>
        </div>
        <div class="wrap-form__field">
          <label class="wrap-form__label">{{ 'admin.wrapStyles.descAr' | translate }}</label>
          <textarea rows="3" dir="rtl" class="wrap-form__input" formControlName="descriptionAr"></textarea>
        </div>
      </div>

      <div class="wrap-form__grid">
        <div class="wrap-form__field">
          <label class="wrap-form__label">{{ 'admin.wrapStyles.price' | translate }} *</label>
          <input type="number" min="0" step="0.01" class="wrap-form__input" formControlName="price" />
          <p class="wrap-form__hint">{{ 'admin.wrapStyles.priceHint' | translate }}</p>
        </div>
        <div class="wrap-form__field">
          <label class="wrap-form__label">{{ 'admin.wrapStyles.sortOrder' | translate }}</label>
          <input type="number" class="wrap-form__input" formControlName="sortOrder" />
        </div>
      </div>

      <label class="wrap-form__check">
        <input type="checkbox" formControlName="isActive" />
        <span>{{ 'admin.wrapStyles.isActive' | translate }}</span>
      </label>

      <div class="wrap-form__actions">
        <a routerLink="/admin/wrap-styles" class="wrap-form__btn wrap-form__btn--ghost">
          {{ 'common.cancel' | translate }}
        </a>
        <button type="submit" class="wrap-form__btn wrap-form__btn--primary" [disabled]="submitting()">
          @if (submitting()) {
            <span class="wrap-form__spinner" aria-hidden="true"></span>
          } @else {
            {{ 'common.save' | translate }}
          }
        </button>
      </div>
    </form>
  }
</div>
